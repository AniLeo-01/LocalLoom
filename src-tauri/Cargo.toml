[package]
name = "openloom-smolvlm"
version = "0.1.0"
description = "Open-source Loom-style recorder with SmolVLM2 and LFM2.5 Audio."
authors = ["OpenLoom contributors"]
edition = "2021"

[lib]
name = "openloom_smolvlm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.4", features = [] }

[dependencies]
base64 = "0.22"
libc = "0.2"
reqwest = { version = "0.12", features = ["json", "multipart", "native-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.2.2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
uuid = { version = "1.11", features = ["v4", "serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
